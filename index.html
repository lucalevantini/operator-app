<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Operator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#0d0d0d; --surface:#141414; --surface-2:#1a1a1a; --surface-3:#202020;
  --border:#262626; --text:#e8e8e6; --text-dim:#9a9a97; --text-mute:#6b6b68;
  --accent:#1D9E75; --accent-text:#04342C; --danger:#E24B4A; --info:#378ADD;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:env(safe-area-inset-bottom); padding-top:env(safe-area-inset-top);}
#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative;}
.header{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px;}
.brand{display:flex; align-items:center; gap:9px;}
.icon-badge{width:28px; height:28px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:none;}
.icon-badge svg{width:16px; height:16px;}
.brand-label{font-size:13px; font-weight:600; color:var(--text-dim);}
.menu-btn{background:none; border:none; color:var(--text-dim); font-size:22px; padding:6px; line-height:1;}
.content{padding:4px 16px 24px;}
.back-link{font-size:12px; color:var(--accent); margin:0 0 10px; cursor:pointer;}
.title{font-size:20px; font-weight:600; margin:6px 0 2px;}
.subtitle{font-size:13px; color:var(--text-dim); margin:0 0 12px; line-height:1.5;}
.preview-banner, .reminder-banner{font-size:12px; color:var(--info); border:0.5px solid var(--info); border-radius:8px; padding:8px 10px; margin-bottom:12px;}
.status-pill{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; border:0.5px solid var(--border); color:var(--text-dim); margin-bottom:12px;}
.status-pill.done{color:var(--accent); border-color:var(--accent);}
.status-pill.alt{color:var(--info); border-color:var(--info);}
.status-pill.quick{color:var(--accent); border-color:var(--accent);}
.status-pill.missed{color:var(--danger); border-color:var(--danger);}
.section{border-top:0.5px solid var(--border); padding-top:14px; margin-top:14px;}
.section-label{font-size:11px; color:var(--text-mute); letter-spacing:0.04em; margin:0 0 10px; font-weight:600;}
.plain-list{margin:0; padding-left:20px; font-size:13px; color:#c9c9c6; line-height:1.85;}
.plain-list li{margin-bottom:2px;}
.superset-group{border:0.5px dashed var(--border); border-radius:14px; padding:8px; margin-bottom:8px;}
.superset-label{font-size:10px; color:var(--info); letter-spacing:0.04em; font-weight:600; margin:2px 0 6px 4px;}
.superset-group .ex-card{margin-bottom:6px;}
.superset-group .ex-card:last-child{margin-bottom:0;}
.ex-card{background:var(--surface-2); border-radius:12px; margin-bottom:8px; overflow:hidden; border:0.5px solid transparent;}
.ex-card.expanded{border-color:var(--accent);}
.ex-card.done{border-color:var(--accent); background:#132720;}
.ex-head{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; cursor:pointer;}
.ex-name{font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
.ex-name .num{color:var(--text-mute); font-weight:400; margin-right:2px;}
.info-dot{width:16px; height:16px; border-radius:50%; border:1px solid var(--text-mute); color:var(--text-mute); font-size:10px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
.info-dot.has-note{border-color:var(--info); color:var(--accent-text); background:var(--info); font-weight:700;}
.ex-meta{font-size:11px; color:var(--text-mute); margin-top:2px;}
.ex-status{font-size:15px; color:var(--text-mute);}
.ex-status.hit{color:var(--accent);}
.ex-body{padding:0 14px 14px;}
.set-grid-header{display:grid; grid-template-columns:22px 1fr 1fr 28px; gap:8px; font-size:10px; color:var(--text-mute); margin-bottom:5px;}
.set-row{display:grid; grid-template-columns:22px 1fr 1fr 28px; gap:8px; align-items:center; margin-bottom:6px;}
.set-row span.idx{font-size:11px; color:var(--text-dim);}
.set-row input{background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; text-align:center; padding:8px 4px; width:100%; font-family:inherit;}
.set-row input:focus{outline:none; border-color:var(--accent);}
.setcheck{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--text-mute); background:var(--bg);}
.setcheck.on{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.note-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:8px;}
.note-row input[type=text]{flex:1; background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; padding:8px; font-family:inherit;}
.tiny-hint{font-size:10px; color:var(--text-mute); margin-top:8px;}
.swap-select{width:100%; background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:12px; padding:7px; margin-top:8px; font-family:inherit;}
.choice-opt{background:var(--surface-2); border:0.5px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; cursor:pointer;}
.choice-opt.selected{border-color:var(--accent); background:#132720;}
.choice-opt .oname{font-size:13px; font-weight:600;}
.choice-opt .ometa{font-size:11px; color:var(--text-mute); margin-top:2px;}
.bottom-bar{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
.btn{flex:1; min-width:120px; border:none; border-radius:10px; padding:13px; font-size:13px; font-weight:600; font-family:inherit;}
.btn.primary{background:var(--accent); color:var(--accent-text); flex-basis:100%;}
.btn.secondary{background:transparent; color:var(--text-dim); border:0.5px solid var(--border);}
textarea{width:100%; background:var(--bg); border:0.5px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; padding:10px; font-family:inherit; margin-top:8px; resize:none;}
.tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.tag{font-size:12px; padding:6px 12px; border-radius:20px; border:0.5px solid var(--border); color:var(--text-dim);}
.tag.selected{border-color:var(--accent); color:var(--accent);}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; justify-content:center; z-index:20;}
.overlay.open{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sheet-title{font-size:15px; font-weight:600;}
.close-btn{background:none; border:none; color:var(--text-dim); font-size:20px; padding:4px;}
.weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:4px;}
.weekday-row span{font-size:9px; color:var(--text-mute); text-align:center;}
.cycle-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:10px;}
.cell{aspect-ratio:1; border-radius:8px; border:0.5px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim); background:var(--surface-2);}
.cell.weekend{background:var(--surface-3);}
.cell.today{box-shadow:0 0 0 2px var(--accent); border-color:var(--accent);}
.cell .today-tag{font-size:7px; font-weight:700; letter-spacing:0.03em; margin-top:1px;}
.week-tag{font-size:10px; color:var(--text-mute); margin:2px 0 6px;}
.cell.st-done{background:var(--accent); color:var(--accent-text);}
.cell.st-done .dn{color:var(--accent-text);}
.cell.st-substituted{background:#146650; color:#d8f5ea;}
.cell.st-substituted .dn{color:#d8f5ea;}
.cell.st-missed{background:var(--danger); color:#3a0d0d;}
.cell.st-missed .dn{color:#3a0d0d;}
.cell.st-today-open{background:#3a3a38; color:var(--text);}
.cell.st-today-open .dn{color:var(--text);}
.cell .dn{font-size:12px; font-weight:600; color:var(--text);}
.cell .st{font-size:8px; margin-top:2px;}
.metric{background:var(--surface-2); border-radius:10px; padding:11px 13px; margin-bottom:8px;}
.metric-top{display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px;}
.metric-top .val{font-weight:600; color:var(--accent);}
.bar-track{height:4px; background:var(--bg); border-radius:2px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent);}
.popup-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; z-index:30; padding:24px;}
.popup-overlay.open{display:flex;}
.popup{background:var(--surface-2); border:0.5px solid var(--border); border-radius:14px; padding:18px; max-width:340px; width:100%;}
.popup p.lead{font-size:12px; color:var(--text-dim); margin:0 0 6px;}
.popup p.ask{font-size:15px; font-weight:600; margin:0 0 14px;}
.chat-hint{margin:20px 0 0; font-size:11px; color:var(--text-mute); line-height:1.6; padding:12px; background:var(--surface-2); border-radius:10px;}
</style>
</head>
