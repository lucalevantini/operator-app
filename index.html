<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Operator</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --bg:#0d0d0d; --surface:#141414; --surface-2:#1a1a1a; --surface-3:#202020;
  --border:#262626; --text:#e8e8e6; --text-dim:#9a9a97; --text-mute:#6b6b68;
  --accent:#1D9E75; --accent-text:#04342C; --danger:#E24B4A; --info:#378ADD;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased;}
body{padding-bottom:env(safe-area-inset-bottom); padding-top:env(safe-area-inset-top);}
#app{max-width:480px; margin:0 auto; min-height:100vh; position:relative;}
.header{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px;}
.brand{display:flex; align-items:center; gap:9px;}
.icon-badge{width:28px; height:28px; border-radius:8px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:none;}
.icon-badge svg{width:16px; height:16px;}
.brand-label{font-size:13px; font-weight:600; color:var(--text-dim);}
.menu-btn{background:none; border:none; color:var(--text-dim); font-size:22px; padding:6px; line-height:1;}
.content{padding:4px 16px 24px;}
.back-link{font-size:12px; color:var(--accent); margin:0 0 10px; cursor:pointer;}
.title{font-size:20px; font-weight:600; margin:6px 0 2px;}
.subtitle{font-size:13px; color:var(--text-dim); margin:0 0 12px; line-height:1.5;}
.preview-banner, .reminder-banner{font-size:12px; color:var(--info); border:0.5px solid var(--info); border-radius:8px; padding:8px 10px; margin-bottom:12px;}
.status-pill{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; border:0.5px solid var(--border); color:var(--text-dim); margin-bottom:12px;}
.status-pill.done{color:var(--accent); border-color:var(--accent);}
.status-pill.alt{color:var(--info); border-color:var(--info);}
.status-pill.quick{color:var(--accent); border-color:var(--accent);}
.status-pill.missed{color:var(--danger); border-color:var(--danger);}
.section{border-top:0.5px solid var(--border); padding-top:14px; margin-top:14px;}
.section-label{font-size:11px; color:var(--text-mute); letter-spacing:0.04em; margin:0 0 10px; font-weight:600;}
.plain-list{margin:0; padding-left:20px; font-size:13px; color:#c9c9c6; line-height:1.85;}
.plain-list li{margin-bottom:2px;}
.superset-group{border:0.5px dashed var(--border); border-radius:14px; padding:8px; margin-bottom:8px;}
.superset-label{font-size:10px; color:var(--info); letter-spacing:0.04em; font-weight:600; margin:2px 0 6px 4px;}
.superset-group .ex-card{margin-bottom:6px;}
.superset-group .ex-card:last-child{margin-bottom:0;}
.ex-card{background:var(--surface-2); border-radius:12px; margin-bottom:8px; overflow:hidden; border:0.5px solid transparent;}
.ex-card.expanded{border-color:var(--accent);}
.ex-card.done{border-color:var(--accent); background:#132720;}
.ex-head{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; cursor:pointer;}
.ex-name{font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;}
.ex-name .num{color:var(--text-mute); font-weight:400; margin-right:2px;}
.info-dot{width:16px; height:16px; border-radius:50%; border:1px solid var(--text-mute); color:var(--text-mute); font-size:10px; display:inline-flex; align-items:center; justify-content:center; flex:none;}
.info-dot.has-note{border-color:var(--info); color:var(--info);}
.ex-meta{font-size:11px; color:var(--text-mute); margin-top:2px;}
.ex-status{font-size:15px; color:var(--text-mute);}
.ex-status.hit{color:var(--accent);}
.ex-body{padding:0 14px 14px;}
.set-grid-header{display:grid; grid-template-columns:22px 1fr 1fr 28px; gap:8px; font-size:10px; color:var(--text-mute); margin-bottom:5px;}
.set-row{display:grid; grid-template-columns:22px 1fr 1fr 28px; gap:8px; align-items:center; margin-bottom:6px;}
.set-row span.idx{font-size:11px; color:var(--text-dim);}
.set-row input{background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; text-align:center; padding:8px 4px; width:100%; font-family:inherit;}
.set-row input:focus{outline:none; border-color:var(--accent);}
.setcheck{width:26px; height:26px; border-radius:6px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px; color:var(--text-mute); background:var(--bg);}
.setcheck.on{background:var(--accent); border-color:var(--accent); color:var(--accent-text);}
.note-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px; gap:8px;}
.note-row input[type=text]{flex:1; background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:13px; padding:8px; font-family:inherit;}
.tiny-hint{font-size:10px; color:var(--text-mute); margin-top:8px;}
.swap-select{width:100%; background:var(--bg); border:0.5px solid var(--border); border-radius:6px; color:var(--text); font-size:12px; padding:7px; margin-top:8px; font-family:inherit;}
.choice-opt{background:var(--surface-2); border:0.5px solid var(--border); border-radius:10px; padding:11px 13px; margin-bottom:8px; cursor:pointer;}
.choice-opt.selected{border-color:var(--accent); background:#132720;}
.choice-opt .oname{font-size:13px; font-weight:600;}
.choice-opt .ometa{font-size:11px; color:var(--text-mute); margin-top:2px;}
.bottom-bar{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
.btn{flex:1; min-width:120px; border:none; border-radius:10px; padding:13px; font-size:13px; font-weight:600; font-family:inherit;}
.btn.primary{background:var(--accent); color:var(--accent-text); flex-basis:100%;}
.btn.secondary{background:transparent; color:var(--text-dim); border:0.5px solid var(--border);}
textarea{width:100%; background:var(--bg); border:0.5px solid var(--border); border-radius:8px; color:var(--text); font-size:13px; padding:10px; font-family:inherit; margin-top:8px; resize:none;}
.tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;}
.tag{font-size:12px; padding:6px 12px; border-radius:20px; border:0.5px solid var(--border); color:var(--text-dim);}
.tag.selected{border-color:var(--accent); color:var(--accent);}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; justify-content:center; z-index:20;}
.overlay.open{display:flex;}
.sheet{background:var(--surface); width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.sheet-title{font-size:15px; font-weight:600;}
.close-btn{background:none; border:none; color:var(--text-dim); font-size:20px; padding:4px;}
.weekday-row{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:4px;}
.weekday-row span{font-size:9px; color:var(--text-mute); text-align:center;}
.cycle-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:10px;}
.cell{aspect-ratio:1; border-radius:8px; border:0.5px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim); background:var(--surface-2);}
.cell.weekend{background:var(--surface-3);}
.cell.today{box-shadow:0 0 0 2px var(--accent); border-color:var(--accent);}
.cell .today-tag{font-size:7px; font-weight:700; letter-spacing:0.03em; margin-top:1px;}
.week-tag{font-size:10px; color:var(--text-mute); margin:2px 0 6px;}
.cell.st-done{background:var(--accent); color:var(--accent-text);}
.cell.st-done .dn{color:var(--accent-text);}
.cell.st-substituted{background:#146650; color:#d8f5ea;}
.cell.st-substituted .dn{color:#d8f5ea;}
.cell.st-missed{background:var(--danger); color:#3a0d0d;}
.cell.st-missed .dn{color:#3a0d0d;}
.cell.st-today-open{background:#3a3a38; color:var(--text);}
.cell.st-today-open .dn{color:var(--text);}
.cell .dn{font-size:12px; font-weight:600; color:var(--text);}
.cell .st{font-size:8px; margin-top:2px;}
.metric{background:var(--surface-2); border-radius:10px; padding:11px 13px; margin-bottom:8px;}
.metric-top{display:flex; justify-content:space-between; margin-bottom:6px; font-size:12px;}
.metric-top .val{font-weight:600; color:var(--accent);}
.bar-track{height:4px; background:var(--bg); border-radius:2px; overflow:hidden;}
.bar-fill{height:100%; background:var(--accent);}
.popup-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:center; justify-content:center; z-index:30; padding:24px;}
.popup-overlay.open{display:flex;}
.popup{background:var(--surface-2); border:0.5px solid var(--border); border-radius:14px; padding:18px; max-width:340px; width:100%;}
.popup p.lead{font-size:12px; color:var(--text-dim); margin:0 0 6px;}
.popup p.ask{font-size:15px; font-weight:600; margin:0 0 14px;}
.chat-hint{margin:20px 0 0; font-size:11px; color:var(--text-mute); line-height:1.6; padding:12px; background:var(--surface-2); border-radius:10px;}
</style>
</head>

/* ---------- storage helpers: probe once at startup for a working backend, then commit to it (avoids per-call timeout stacking that caused a long blank screen) ---------- */
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_,reject)=> setTimeout(()=>reject(new Error("storage timeout")), ms))
  ]);
}
let cloudStorageWorks = null; // null = unknown, true/false once probed
async function probeStorage(){
  if(!window.storage){ cloudStorageWorks = false; return; }
  try{
    await withTimeout(window.storage.set("__probe__", "1", false), 500);
    cloudStorageWorks = true;
  }catch(e){
    cloudStorageWorks = false;
  }
}
async function sget(key){
  if(cloudStorageWorks){
    try{ const r = await window.storage.get(key,false); return r?JSON.parse(r.value):null; }catch(e){ return null; }
  }
  try{ const v = localStorage.getItem("operator:"+key); return v?JSON.parse(v):null; }catch(e){ return null; }
}
async function sset(key,val){
  if(cloudStorageWorks){
    try{ await window.storage.set(key, JSON.stringify(val), false); return; }catch(e){}
  }
  try{ localStorage.setItem("operator:"+key, JSON.stringify(val)); }catch(e){}
}
async function slist(prefix){
  if(cloudStorageWorks){
    try{ const r = await window.storage.list(prefix,false); return r?r.keys:[]; }catch(e){ return []; }
  }
  try{ const out=[]; const p="operator:"+prefix; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(p)===0) out.push(k.slice("operator:".length)); } return out; }catch(e){ return []; }
}

/* ---------- date helpers ---------- */
function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function todayISO(){ return iso(new Date()); }
function addDays(dateStr,n){ const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }
function isLastDayOfMonth(dateStr){ const d=new Date(dateStr+"T00:00:00"); const next=new Date(d); next.setDate(d.getDate()+1); return next.getMonth()!==d.getMonth(); }

function dayIndexFor(dateStr){
  let n = diffDays(CYCLE_START, dateStr) % 14;
  if(n<0) n += 14;
  return n;
}

async function reconcileMissed(){
  const today = todayISO();
  let cursor = PROGRAM_START;
  let guard = 0;
  while(cursor < today && guard < 400){
    const existing = await sget("log:"+cursor);
    if(!existing){
      await sset("log:"+cursor, {dayId: PLAN[dayIndexFor(cursor)].id, status:"missed", exercises:{}});
    }
    cursor = addDays(cursor,1);
    guard++;
  }
}

/* ---------- state ---------- */
let state = { viewDate: null, viewMode:"plan", menuOpen:false, expanded:null, altOpen:false, log:null, popupQueue:[], popup:null, noteEditor:null, sessionNoteOpen:false, exportOpen:false };

function currentDay(){ return state.viewMode==="quick" ? QUICK : PLAN[dayIndexFor(state.viewDate)]; }

async function loadLogFor(dateStr){
  let l = await sget("log:"+dateStr);
  if(!l) l = { dayId: PLAN[dayIndexFor(dateStr)].id, status:"pending", exercises:{} };
  return l;
}
async function saveLog(){ await sset("log:"+state.viewDate, state.log); }

/* ---------- progression (keyed by stable day.id + exercise.id) ---------- */
function incrementFor(ex){
  if(ex.equipment==="bodyweight") return {kind:"reps", amount:1};
  if(ex.equipment==="dumbbell" || ex.equipment==="kettlebell") return {kind:"kg", amount:2};
  return {kind:"kg", amount:2.5};
}
function allSetsChecked(ex, entry){
  if(!entry || !entry.sets) return false;
  if(entry.sets.length < ex.sets) return false;
  for(let s=0;s<ex.sets;s++){ if(!entry.sets[s] || !entry.sets[s].checked) return false; }
  return true;
}
function exerciseHit(ex, entry){
  if(!entry || !entry.sets) return false;
  if(entry.sets.length < ex.sets) return false;
  for(let s=0;s<ex.sets;s++){
    const set = entry.sets[s];
    if(!set || !set.checked) return false;
    if(set.reps===undefined || set.reps==="" || Number(set.reps) < ex.reps) return false;
    if(ex.unit==="load" && ex.equipment!=="bodyweight" && ex.load!==undefined){
      if(set.weight===undefined || set.weight==="" || Number(set.weight) < ex.load) return false;
    }
  }
  return true;
}
async function getOverride(dayId, exId){ return await sget("override:"+dayId+":"+exId); }
async function setOverride(dayId, exId, val){ await sset("override:"+dayId+":"+exId, val); }
async function getStreak(dayId, exId){ return (await sget("streak:"+dayId+":"+exId)) || 0; }
async function setStreak(dayId, exId, val){ await sset("streak:"+dayId+":"+exId, val); }

async function evaluateProgression(day){
  if(day.kind !== "training" || day.id===QUICK_ID) return;
  for(const baseEx of day.main){
    if(baseEx.unit !== "load") continue;
    const ex = await effectiveExercise(day.id, baseEx);
    const entry = state.log.exercises[baseEx.id];
    const hit = exerciseHit(ex, entry);
    let streak = await getStreak(day.id, baseEx.id);
    if(hit){
      streak += 1;
      if(streak >= 3){
        state.popupQueue.push({dayId:day.id, exId:baseEx.id, exName:ex.name});
        streak = 0;
      }
    } else {
      streak = 0;
    }
    await setStreak(day.id, baseEx.id, streak);
  }
}

async function effectiveExercise(dayId, ex){
  if(dayId===QUICK_ID) return ex;
  const ov = await getOverride(dayId, ex.id);
  if(!ov) return ex;
  const copy = Object.assign({}, ex);
  if(ov.kg !== undefined) copy.load = ov.kg;
  if(ov.reps !== undefined) copy.reps = ov.reps;
  return copy;
}

async function getNote(dayId, exId){ return await sget("note:"+dayId+":"+exId); }
async function saveNote(dayId, exId, text){ await sset("note:"+dayId+":"+exId, {text, date: todayISO()}); }

  else if(st==="quick") statusPill = `<span class="status-pill quick">No-equipment workout logged</span>`;

      <button class="menu-btn" id="nextDayBtn" style="font-size:14px; padding:6px 8px;">&#8250;</button>
      <button class="menu-btn" id="menuBtn">&#9776;</button>
    </div>
  </div>
  <div class="content">`;

  if(state.viewMode==="quick"){
    html += `<div class="back-link" id="backToPlan">&#8249; Back to today's plan</div>`;
  }

  if(isPreview && state.viewDate===PROGRAM_START && state.viewMode==="plan"){
    html += `<div class="preview-banner">Cycle 1 starts Aug 25, 2026 — previewing Day 1.</div>`;
  }

  if(isToday && day.id!==QUICK_ID && dayIndexFor(todayISO())===13){
    html += `<div class="reminder-banner">Last day of this training cycle — export your data (menu → Export) and paste it to Claude for a progress report.</div>`;

    else if(day.id==="endurance-swim") timeLabel = "45min";

    <div class="subtitle">${timeLabel? timeLabel+": ":""}${day.focus}</div>

    day.warmup.forEach(w => html += `<li>${w}</li>`);
    html += `</ol></div>`;
  }

  if(day.kind === "training"){
    html += `<div class="section"><p class="section-label">MAIN WORK</p>`;
    let i=0, openGroup=null;
    for(const baseEx of day.main){
      const ex = await effectiveExercise(day.id, baseEx);

        if(openGroup) html += `</div>`;
        html += `<div class="superset-group"><div class="superset-label">SUPERSET</div>`;
        openGroup = grp;
      } else if(!grp && openGroup){
        html += `</div>`;
        openGroup = null;
      }
      html += await renderExercise(ex, i, day.id);
      i++;
    }

    html += `<div class="section"><p class="section-label">WHAT YOU ACTUALLY DID</p>
      <p style="font-size:13px; color:#c9c9c6;">${state.log.altTag || ""} ${state.log.altDuration? "· "+state.log.altDuration+" min":""}</p>
      <p style="font-size:13px; color:var(--text-dim);">${state.log.altNote || ""}</p>
    </div>`;
  }

  if(state.log.sessionNote){
    html += `<div class="section"><p class="section-label">SESSION NOTES</p><p style="font-size:13px; color:#c9c9c6;">${state.log.sessionNote}</p></div>`;
  }

  if(state.altOpen){
    html += renderAltForm();
  } else {
    html += `<div class="bottom-bar">
      <button class="btn primary" id="logBtn">${state.log.status==="completed"||state.log.status==="quick" ? "Update log":"Log this workout"}</button>
      ${state.viewMode==="plan" ? `<button class="btn secondary" id="quickBtn">No-equipment 30 min</button>` : ``}
      <button class="btn secondary" id="altBtn">Did something else</button>
    </div>`;
  }

  html += `</div>`;

  app.innerHTML = html;
  renderMenu();
  renderPopup();
  renderNoteEditor(day);
  renderSessionNotePopup();
  renderExportPopup();
  attachHandlers(day);
}

function dateLabel(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}

async function renderExercise(ex, i, dayId){
  const expanded = state.expanded === ex.id;
  const entry = state.log.exercises[ex.id] || {sets:[]};
  const done = allSetsChecked(ex, entry);
  const note = await getNote(dayId, ex.id);
  let body = "";

  if(expanded){
    if(ex.unit === "load"){
      body += `<div class="ex-body">
        <div class="set-grid-header"><span></span><span>${ex.equipment==="bodyweight"?"Bodyweight":"Weight (kg)"}</span><span>Reps</span><span>Done</span></div>`;
      for(let s=0;s<ex.sets;s++){
        const setVal = entry.sets[s] || {};
        const wVal = setVal.weight!==undefined ? setVal.weight : (ex.equipment==='bodyweight' ? '' : (ex.load!==undefined?ex.load:''));
        const rVal = setVal.reps!==undefined ? setVal.reps : ex.reps;
        const checked = !!setVal.checked;
        body += `<div class="set-row">
          <span class="idx">${s+1}</span>
          <input inputmode="decimal" data-kind="weight" data-set="${s}" data-ex="${ex.id}" value="${wVal}" placeholder="${ex.equipment==='bodyweight'?'BW':''}" ${ex.equipment==='bodyweight'?'disabled':''}/>
          <input inputmode="numeric" data-kind="reps" data-set="${s}" data-ex="${ex.id}" value="${rVal}"/>
          <span class="setcheck ${checked?'on':''}" data-kind="setcheck" data-set="${s}" data-ex="${ex.id}">${checked?'&#10003;':''}</span>
        </div>`;
      }
      body += `<p class="tiny-hint">Prescribed: ${ex.sets}×${ex.reps}${ex.load!==undefined && ex.equipment!=='bodyweight' ?' @ '+ex.load+'kg':''} · rest ${formatRest(ex.rest)}${ex.notes? ' · '+ex.notes:''}</p>`;
      if(ex.alternatives && ex.alternatives.length){
        body += `<select class="swap-select" data-kind="swap" data-ex="${ex.id}">
          <option value="">Swap exercise if needed...</option>
          ${ex.alternatives.map(a=>`<option value="${a}" ${entry.swap===a?'selected':''}>${a}</option>`).join("")}
        </select>`;
      }
      body += `</div>`;
    } else if(ex.unit === "time"){
      const setVal = entry.sets[0] || {};
      const checked = !!setVal.checked;
      body += `<div class="ex-body">
        <div class="note-row"><span style="font-size:12px; color:var(--text-dim);">Duration held (s)</span>
        <input type="text" inputmode="numeric" style="width:70px;" data-kind="time" data-set="0" data-ex="${ex.id}" value="${setVal.reps!==undefined?setVal.reps:ex.timeTarget}"/>
        <span class="setcheck ${checked?'on':''}" data-kind="setcheck" data-set="0" data-ex="${ex.id}">${checked?'&#10003;':''}</span></div>
        <p class="tiny-hint">Target: ${ex.timeTarget}s · ${ex.notes||""}</p></div>`;
    } else {
      body += `<div class="ex-body">
        <div class="note-row"><span style="font-size:12px; color:var(--text-dim);">Done</span>
        <span class="setcheck ${entry.done?'on':''}" data-kind="notedone" data-ex="${ex.id}">${entry.done?'&#10003;':''}</span></div>
        ${ex.logDistance ? `<div class="note-row"><span style="font-size:12px; color:var(--text-dim);">Distance (m)</span><input type="text" inputmode="numeric" style="width:90px;" data-kind="distance" data-ex="${ex.id}" value="${entry.distance!==undefined?entry.distance:''}" placeholder="e.g. 1000"/></div>` : ``}
        <p class="tiny-hint">${ex.notes||""}${ex.rest? ' · rest '+formatRest(ex.rest):''}</p></div>`;
    }
  }

  const metaLine = ex.unit==="load" ? `${ex.sets}×${ex.reps}${ex.load!==undefined && ex.equipment!=='bodyweight'?' @ '+ex.load+'kg':''}` : (ex.unit==="time" ? `Hold ${ex.timeTarget}s` : (ex.notes||""));
  const displayName = entry.swap ? `${ex.name} → ${entry.swap}` : ex.name;

  return `<div class="ex-card ${expanded?'expanded':''} ${done?'done':''}">
    <div class="ex-head" data-toggle="${ex.id}">
      <div>
        <div class="ex-name"><span class="num">${i+1}.</span>${displayName}<span class="info-dot ${note?'has-note':''}" data-noteicon="${ex.id}">i</span></div>
        <div class="ex-meta">${metaLine}</div>
      </div>
      <div class="ex-status ${done?'hit':''}">${done? '&#10003;' : '&#8250;'}</div>
    </div>
    ${body}
  </div>`;
}

async function renderMenu(){
  const overlay = document.createElement("div");
  overlay.className = "overlay" + (state.menuOpen ? " open" : "");
  overlay.id = "menuOverlay";

  const cycleNum = Math.floor(diffDays(CYCLE_START, state.viewDate) / 14);
  const cycleStartDate = addDays(CYCLE_START, cycleNum*14);
  const logs = [];
  for(let i=0;i<14;i++){
    const d = addDays(cycleStartDate, i);
    const l = await sget("log:"+d);
    logs.push({d, l, i});
  }

  function monthLabel(){
    const d1 = new Date(cycleStartDate+"T00:00:00");
    const d2 = new Date(addDays(cycleStartDate,13)+"T00:00:00");
    const opts = {month:'long', year:'numeric'};
    if(d1.getMonth()===d2.getMonth()) return d1.toLocaleDateString(undefined,opts);
    return d1.toLocaleDateString(undefined,{month:'short'})+" – "+d2.toLocaleDateString(undefined,opts);
  }

  function weekCells(list){
    return list.map(({d,l,i}) => {
      const isTodayCell = d === todayISO();
      const dow = new Date(d+"T00:00:00").getDay();
      const weekend = (dow===0 || dow===6);
      let statusClass = "";
      if(l){
        if(l.status==="completed") statusClass = "st-done";
        else if(l.status==="alternate" || l.status==="quick") statusClass = "st-substituted";
        else if(l.status==="missed") statusClass = "st-missed";
      } else if(isTodayCell){
        statusClass = "st-today-open";
      }
      const dayOfMonth = new Date(d+"T00:00:00").getDate();
      return `<div class="cell ${isTodayCell?'today':''} ${weekend?'weekend':''} ${statusClass}" data-jump="${d}">
        <div class="dn">${dayOfMonth}</div>
        ${isTodayCell? `<div class="today-tag">TODAY</div>` : ``}
      </div>`;
    }).join("");
  }

  const week1 = logs.slice(0,7), week2 = logs.slice(7,14);
  const week1HasToday = week1.some(x=>x.d===todayISO());
  const week2HasToday = week2.some(x=>x.d===todayISO());
  const cells = `<p class="section-label" style="margin-bottom:6px;">${monthLabel()}</p>
    <p class="week-tag">Week 1${week1HasToday?' — current':''}</p>
    <div class="weekday-row"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="cycle-grid">${weekCells(week1)}</div>
    <p class="week-tag">Week 2${week2HasToday?' — current':''}</p>
    <div class="weekday-row"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
    <div class="cycle-grid">${weekCells(week2)}</div>`;

  const metrics = await computeProgress();

  overlay.innerHTML = `<div class="sheet">
    <div class="sheet-head"><span class="sheet-title">Cycle ${cycleNum+1} overview</span><button class="close-btn" id="closeMenu">&times;</button></div>
    ${cells}
    <p class="section-label" style="margin-top:14px;">PROGRESS</p>
    ${metrics}
    <button class="btn secondary" id="exportBtn" style="margin-top:10px;">Export data to paste to Claude</button>
  </div>`;

  const existing = document.getElementById("menuOverlay");
  if(existing) existing.remove();
  document.getElementById("app").appendChild(overlay);

  overlay.addEventListener("click", (e)=>{
    if(e.target.id === "menuOverlay" || e.target.id === "closeMenu"){ state.menuOpen=false; render(); }
    const jump = e.target.closest("[data-jump]");
    if(jump){ setView(jump.dataset.jump); }
    if(e.target.id === "exportBtn"){ openExportPopup(); }
  });
}

async function generateExportText(){
  const keys = (await slist("log:")).sort();
  const lines = [`Training log export — generated ${todayISO()}`, ""];
  for(const k of keys){
    const l = await sget(k);
    if(!l) continue;
    const date = k.replace("log:","");
    const day = PLAN.find(d=>d.id===l.dayId) || QUICK;
    lines.push(`${date} — ${day.title} [${l.status}]`);
    if(l.status==="alternate"){
      lines.push(`  Alternate: ${l.altTag||""} ${l.altDuration?l.altDuration+'min':''} ${l.altNote||''}`);
    }
    if(day.kind==="choice" && l.exercises && l.exercises.choice!==undefined){
      const opt = day.main.options[l.exercises.choice];
      lines.push(`  Activity: ${opt?opt.name:''}${l.actualDuration?' — '+l.actualDuration+' min':''}${l.actualDistance?' — '+l.actualDistance+' km':''}`);
    }
    if(l.exercises && day.main && Array.isArray(day.main)){
      for(const exId of Object.keys(l.exercises)){
        if(exId==="choice") continue;
        const ex = day.main.find(m=>m.id===exId);
        const entry = l.exercises[exId];
        if(entry && entry.sets){
          const setsStr = entry.sets.map(s=>{
            if(!s) return "-";
            const w = (s.weight!==undefined && s.weight!=='') ? s.weight+"kg x" : "";
            const r = s.reps!==undefined ? s.reps : "";
            return `${s.checked?'✓':'-'} ${w}${r}`;
          }).join(", ");
          lines.push(`  ${ex?ex.name:exId}: ${setsStr}`);
        } else if(entry && (entry.done || entry.distance!==undefined)){
          const parts = [];
          if(entry.done) parts.push("done");
          if(entry.distance) parts.push(`${entry.distance}m`);
          lines.push(`  ${ex?ex.name:exId}: ${parts.join(", ")}`);
        } else {
          continue;
        }
        const exNote = await getNote(l.dayId, exId);
        if(exNote && exNote.text) lines.push(`    Exercise note: ${exNote.text}`);
      }
    }
    if(l.sessionNote) lines.push(`  Notes: ${l.sessionNote}`);
    lines.push("");
  }
  return lines.join("\n");
}

async function computeProgress(){
  const keys = await slist("log:");
  let logged=0, missed=0, total=0;
  const bestLift = {};
  for(const k of keys){
    const l = await sget(k);
    if(!l) continue;
    total++;
    if(l.status==="completed" || l.status==="alternate" || l.status==="quick") logged++;
    else if(l.status==="missed") missed++;
    if(l.exercises && l.status==="completed" && l.dayId){
      const day = PLAN.find(d=>d.id===l.dayId);
      if(day && day.kind==="training"){
        Object.keys(l.exercises).forEach(exId=>{
          const ex = day.main.find(m=>m.id===exId);
          if(!ex || ex.unit!=="load" || ex.equipment==="bodyweight") return;
          const entry = l.exercises[exId];
          if(!entry.sets) return;
          entry.sets.forEach(s=>{
            if(s.checked && s.weight && s.reps){
              const e1rm = Number(s.weight) * (1 + Number(s.reps)/30);
              if(!bestLift[ex.name] || e1rm > bestLift[ex.name]) bestLift[ex.name] = e1rm;
            }
          });
        });
      }
    }
  }
  let html = `<div class="metric"><div class="metric-top"><span>Sessions logged</span><span class="val">${logged} / ${total}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${total?Math.round(logged/total*100):0}%"></div></div></div>`;

  const keyLifts = ["Back squat","Trap bar deadlift","Overhead press","Weighted pull-up"];
  keyLifts.forEach(name=>{
    if(bestLift[name]){
      html += `<div class="metric"><div class="metric-top"><span>${name} · est. 1RM (plates)</span><span class="val">${Math.round(bestLift[name]*10)/10}kg</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, Math.round(bestLift[name]/150*100))}%"></div></div></div>`;
    }
  });
  if(missed>0){
    html += `<div class="metric"><div class="metric-top"><span>Missed sessions</span><span class="val" style="color:var(--danger);">${missed}</span></div></div>`;
  }
  return html;
}

  overlay.innerHTML = `<div class="popup">
    <p class="lead">${p.exName} — three clean sessions in a row, full weight and reps each time.</p>

  </div>`;
  document.getElementById("app").appendChild(overlay);

/* ---------- event handlers ---------- */
function attachHandlers(day){
  const menuBtn = document.getElementById("menuBtn");
  if(menuBtn) menuBtn.onclick = ()=>{ state.menuOpen=true; render(); };

  const todayBtn = document.getElementById("todayBtn");
  if(todayBtn) todayBtn.onclick = ()=>{ setView(todayISO()); };

  const prevDayBtn = document.getElementById("prevDayBtn");
  if(prevDayBtn) prevDayBtn.onclick = ()=>{ setView(addDays(state.viewDate,-1)); };

  const nextDayBtn = document.getElementById("nextDayBtn");
  if(nextDayBtn) nextDayBtn.onclick = ()=>{ setView(addDays(state.viewDate,1)); };

  const backLink = document.getElementById("backToPlan");
  if(backLink) backLink.onclick = ()=>{ state.viewMode="plan"; state.expanded=null; render(); };

  const quickBtn = document.getElementById("quickBtn");
  if(quickBtn) quickBtn.onclick = ()=>{ state.viewMode="quick"; state.expanded=null; state.altOpen=false; render(); };

  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest("[data-noteicon]")) return;
      const id = el.dataset.toggle;
      state.expanded = state.expanded===id ? null : id;
      render();
    };
  });

  document.querySelectorAll("[data-noteicon]").forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); state.noteEditor = el.dataset.noteicon; render(); };
  });

  document.querySelectorAll("input[data-kind='weight'],input[data-kind='reps'],input[data-kind='time']").forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const exId = inp.dataset.ex;
      const setIdx = Number(inp.dataset.set);
      if(!state.log.exercises[exId]) state.log.exercises[exId] = {sets:[]};
      if(!state.log.exercises[exId].sets[setIdx]) state.log.exercises[exId].sets[setIdx] = {};
      if(inp.dataset.kind==="weight") state.log.exercises[exId].sets[setIdx].weight = inp.value;
      if(inp.dataset.kind==="reps" || inp.dataset.kind==="time") state.log.exercises[exId].sets[setIdx].reps = inp.value;
      await saveLog();
    });
  });

  document.querySelectorAll("[data-kind='setcheck']").forEach(el=>{
    el.onclick = async ()=>{
      const exId = el.dataset.ex;
      const setIdx = Number(el.dataset.set);
      if(!state.log.exercises[exId]) state.log.exercises[exId] = {sets:[]};
      if(!state.log.exercises[exId].sets[setIdx]) state.log.exercises[exId].sets[setIdx] = {};
      const cur = state.log.exercises[exId].sets[setIdx];
      cur.checked = !cur.checked;
      if(cur.checked && (cur.reps===undefined || cur.reps==="")){
        const wInput = document.querySelector(`input[data-kind='weight'][data-ex='${exId}'][data-set='${setIdx}']`);
        const rInput = document.querySelector(`input[data-kind='reps'][data-ex='${exId}'][data-set='${setIdx}']`);
        if(rInput && rInput.value!=="") cur.reps = rInput.value;
        if(wInput && wInput.value!=="") cur.weight = wInput.value;
      }
      await saveLog();
      render();
    };
  });

  document.querySelectorAll("[data-kind='swap']").forEach(sel=>{
    sel.onchange = async ()=>{
      const exId = sel.dataset.ex;
      if(!state.log.exercises[exId]) state.log.exercises[exId] = {sets:[]};
      state.log.exercises[exId].swap = sel.value || undefined;
      await saveLog();
      render();
    };
  });

  document.querySelectorAll("[data-kind='notedone']").forEach(el=>{
    el.onclick = async ()=>{
      const exId = el.dataset.ex;
      if(!state.log.exercises[exId]) state.log.exercises[exId] = {};
      state.log.exercises[exId].done = !state.log.exercises[exId].done;
      await saveLog();
      render();
    };
  });

  document.querySelectorAll("input[data-kind='distance']").forEach(inp=>{
    inp.addEventListener("change", async ()=>{
      const exId = inp.dataset.ex;
      if(!state.log.exercises[exId]) state.log.exercises[exId] = {};
      state.log.exercises[exId].distance = inp.value;
      await saveLog();
    });
  });

  document.querySelectorAll("[data-choice]").forEach(el=>{
    el.onclick = async ()=>{
      state.log.exercises.choice = Number(el.dataset.choice);
      await saveLog();
      render();
    };
  });

  const choiceDur = document.getElementById("choiceDuration");
  if(choiceDur) choiceDur.addEventListener("change", async ()=>{ state.log.actualDuration = choiceDur.value; await saveLog(); });
  const choiceDist = document.getElementById("choiceDistance");
  if(choiceDist) choiceDist.addEventListener("change", async ()=>{ state.log.actualDistance = choiceDist.value; await saveLog(); });

  const logBtn = document.getElementById("logBtn");
  if(logBtn) logBtn.onclick = async ()=>{
    state.log.status = (day.id===QUICK_ID) ? "quick" : "completed";
    await saveLog();
    if(day.kind === "training" && day.id!==QUICK_ID){
      state.popupQueue = [];
      await evaluateProgression(day);
      if(state.popupQueue.length){ nextPopup(); return; }
    }
    state.sessionNoteOpen = true;
    render();
  };

  const altBtn = document.getElementById("altBtn");
  if(altBtn) altBtn.onclick = ()=>{ state.altOpen = true; render(); };

  const cancelAlt = document.getElementById("cancelAltBtn");
  if(cancelAlt) cancelAlt.onclick = ()=>{ state.altOpen = false; render(); };

  document.querySelectorAll("[data-alttag]").forEach(el=>{
    el.onclick = ()=>{ state.log.altTag = el.dataset.alttag; render(); };
  });

  const saveAlt = document.getElementById("saveAltBtn");
  if(saveAlt) saveAlt.onclick = async ()=>{
    state.log.status = "alternate";
    state.log.altDuration = document.getElementById("altDuration").value;
    state.log.altNote = document.getElementById("altNote").value;
    state.altOpen = false;
    await saveLog();
    render();
  };
}

async function setView(dateStr){
  state.viewDate = dateStr;
  state.viewMode = "plan";
  state.expanded = null;
  state.altOpen = false;
  state.menuOpen = false;
  state.noteEditor = null;
  state.sessionNoteOpen = false;
  state.exportOpen = false;
  state.log = await loadLogFor(dateStr);
  render();
}

/* ---------- init ---------- */
(async function init(){
  await probeStorage();
  await reconcileMissed();
  const start = (todayISO() < PROGRAM_START) ? PROGRAM_START : todayISO();
  await setView(start);
})();
</script>
